# Every limit lives here. Nothing in recovery/ hardcodes a threshold.
# The full three-arm comparison must re-run with changed parameters in seconds,
# so the panel can change them live.

policy:
  # Participates in the idempotency key: recovery:{payment_id}:{policy_version}:{attempt_n}
  # Bumping this deliberately re-opens decisions that were already made.
  version: "0.1.0"

database:
  path: "data/recovery.db"

ingest:
  # Razorpay treats a response slower than this as a timeout and resends.
  # We acknowledge inside this budget and decide in a worker.
  ack_budget_seconds: 5.0
  accepted_events:
    - payment.failed

  # Payments that are validation artefacts rather than failures. A mandate
  # registration fires a dummy debit to prove the mandate works; it is ALWAYS
  # status: failed and never represents money that was owed. Treating it as a
  # recoverable failure would open a case, spend a contact and enter the batch
  # on every single new mandate — a false positive on the happy path.
  filtered_reasons:
    - upi_dummy_payment

worker:
  batch_size: 50
  # A claimed job older than this is considered abandoned and may be re-claimed.
  claim_timeout_seconds: 300
  max_attempts_per_job: 3

late_auth:
  # A payment marked Failed can still become Authorized while Razorpay polls the
  # bank. Documented: ~3 days. Inside this window the webhook body is not
  # authoritative and state must be re-fetched before any decision.
  poll_window_days: 3
  # Refuse to decide if the authoritative refresh fails. Never fall back to the
  # webhook payload -- that is the whole point of the refresh.
  require_state_refresh: true

# --- Allocator (C3) ---------------------------------------------------------
# ORDINAL ONLY. Every value here is a day offset, a day-of-month, a channel
# name or a count. There is deliberately no probability in this block, and none
# may be added: the policy may depend on orderings, never on magnitudes.
allocator:
  version: "1.0.0"

  infrastructure:
    # "Tomorrow" at HIGH; later at MODERATE. The ordering is the content --
    # a transient fault is most likely already gone, and less confidence in
    # that diagnosis buys more time before spending a capped execution.
    high_offset_days: 1
    moderate_offset_days: 2

  liquidity:
    # Never sooner than this: the customer is broke today, and the ordinal fact
    # is that liquidity recovers better later than sooner.
    min_offset_days: 2
    # Days of the month when salaries and similar credits typically land.
    # A structural claim about when money arrives, not a probability that it
    # will. See ASSUMPTIONS.md.
    funding_days_of_month: [1, 2, 3, 28, 29, 30, 31]
    # Do not wait past this looking for a funding day -- the horizon and the
    # attempt cap both bound how long holding is worth it.
    max_wait_days: 6

  contact:
    default_channel: sms
    # ATTENTION means the customer was reached and did not act. Reaching them
    # the same way again is the one thing already known not to work.
    attention_channel: whatsapp
    max_per_case: 1

# --- Guard (C4) -------------------------------------------------------------
# Admission control between Allocate and Execute. Every limit lives here.
guard:
  # A contact costs no mandate execution but is not free: every customer-visible
  # message carries mandate-survival cost. This is the guard's ceiling, sitting
  # above whatever the allocator chooses to spend.
  contact_budget_per_case: 2
  # Three failure notices in three days is how a mandate gets cancelled from a
  # UPI app. The cooldown is the floor under that.
  contact_cooldown_hours: 24
  # Fallback when the order entity carries no explicit expiry. Order validity is
  # merchant- and link-configured rather than a documented platform constant, so
  # this is a configured assumption, not a claim about Razorpay's defaults.
  order_validity_days: 15
  # What the attempt cap counts. See CHALLENGES 008.
  #   system_initiated            -- attempts_seen already excludes customer taps
  #   discount_customer_attempts  -- attempts_seen came from order.attempts and
  #                                  is conflated; subtract our own contacts
  execution_counter: system_initiated

# --- Storm governor (C11) ---------------------------------------------------
# Regulatory basis: NPCI directs PSPs to initiate executions at moderated TPS
# and may apply rate limiters to avoid spikes. Scheduling T+1 for every failure
# in a batch produces exactly that spike, aimed at whichever issuer caused it.
#
# There is deliberately NO list of issuers here, and there never should be.
# Outages rotate -- 12 of 25 banks in the NPCI data appear in exactly one month,
# and the second persistent bank looked fine in April and was five times worse
# by June (CHALLENGES 011). A list built from any one month misses the bank that
# is on its way down. The ceiling is a function of observed conditions instead.
governor:
  window_hours: 24
  # Executions admitted per issuer per window, by observed condition.
  base_ceiling: 50
  strained_ceiling: 20
  degraded_ceiling: 5
  # Below this many observations an issuer is not measured, and "no evidence"
  # is not treated as "healthy".
  min_observations: 10
  # Fallbacks, used only when no sourced outage distribution is supplied.
  strained_failure_share: 0.156
  degraded_failure_share: 0.530
  # Multiplier applied to the NPCI-published outage shares to get failure-share
  # thresholds. Outage share is time-down; failure share is attempts-failed, and
  # they are not the same quantity -- this is the acknowledged fudge between
  # them, kept explicit rather than buried in a constant.
  sourced_multiplier: 20
  # Spread scheduled executions across this many minutes, forward only.
  jitter_minutes: 45

# Consumed by C4 (guard). Recorded here from day one so the NPCI constants live
# in config rather than in code. NOT read by C1.
regulatory:
  attempt_cap: 4            # 1 initial execution + 3 retries, ever
  # PDN lead time differs by rail. 24h was the generic figure and is wrong for
  # both rails we actually schedule on.
  #   UPI  25h — the notification must land a clear day ahead
  #   Card 36h — the AFA authentication link is valid 72h above the AFA
  #              threshold, so the notification goes out earlier
  # `pdn_lead_time_hours` remains the fallback for a rail not listed.
  pdn_lead_time_hours: 25
  pdn_lead_time_hours_by_rail:
    upi: 25
    card: 36
    emandate: 25
  pdn_cutoff_ist: "23:50"   # PDN requests at/after this are rejected for debit_date = T+1
  afa_threshold_inr: 15000
  peak_windows_ist:
    - ["10:00", "13:00"]
    - ["17:00", "21:30"]
  # UPI auto-debits must COMPLETE by 21:00 IST. Combined with the peak bars,
  # the legal window for a UPI execution is 00:00–10:00 and 13:00–17:00 —
  # the 21:30–24:00 slot is outside peak but past the completion deadline, so
  # scheduling there produces an execution that cannot finish.
  upi_completion_deadline_ist: "21:00"
  # A UPI subsequent payment must never be scheduled on the final day of the
  # billing cycle: there is no day left to retry into, so a failure there
  # forfeits the remaining budget outright.
  upi_no_schedule_on_last_cycle_day: true
