# =============================================================================
# STUB — NOT AUTHORED. The rows below are illustrative machinery tests, not the
# taxonomy. The real (method, source, step, reason) -> class mapping and the
# cost matrix are hand-authored (CLAUDE.md, "Do not write these for me").
#
# The classifier reads this file. It does not contain a mapping of its own, and
# it will not run with `status: STUB` unless explicitly allowed — see
# `load_classifier(allow_stub=...)`.
# =============================================================================

status: STUB
version: "0.0.0-stub"

# --- Value space ------------------------------------------------------------
# Method-partitioned: the legal `source` values differ per method.
#
# **This is a LOWER BOUND, not an enumeration.** It is assembled from the
# error-parameters reference, and that reference is a subset of what the API
# actually returns. A captured test-mode netbanking failure came back with
# `source: bank`, which the reference lists only for emandate — so `bank` is
# now in the netbanking set, from evidence rather than from the doc.
#
# A source outside its method's set is **surfaced, not rejected**: it is
# recorded on the classification and audited for review, and classification
# proceeds normally. Rejecting on it discarded valid production payloads.
# See CHALLENGES 007.
#
# Still true and worth keeping: there is no `razorpay` source — it is `internal`.

source_space:
  card: [customer, business, internal, gateway, issuer_bank]
  upi: [customer, business, internal, gateway, issuer_bank, customer_psp, network, beneficiary_bank]
  # `bank` is here on the evidence of a real capture, not on the documentation.
  netbanking: [customer, business, internal, issuer_bank, bank]
  emandate: [customer, bank, business, internal, gateway, issuer_bank]

# Deliberately empty. An alias silently rewrites an observed value, so each one
# needs a documented justification. Populate only with cause to.
#   Example, if it were ever justified:  {razorpay: internal}
source_aliases: {}

# --- Confidence -------------------------------------------------------------
# Confidence is an output of classification, not a footnote on it. The bands
# are what downstream components branch on:
#   HIGH     -> act on the class, exclusion permitted (C10)
#   MODERATE -> act on the class, but reorder only, never exclude
#   LOW      -> do not trust the class; resolve through the cost matrix
confidence_bands:
  high: 0.85
  moderate: 0.60

# --- Fallback ---------------------------------------------------------------
# There is deliberately **no `fallback.class`**. An unmapped key resolves through
# the cost model below, so a configured fallback cannot drift out of agreement
# with the matrix that is supposed to justify it. Change the costs and the
# fallback follows automatically.
#
# Never silently applied: every use emits `failure.unmapped` to the audit trail
# with the key that missed.
fallback:
  confidence: 0.0

# --- Cost model -------------------------------------------------------------
# STUB VALUES throughout. Two priced things, because a decision costs more than
# a wrong label: getting the class wrong, and contacting the customer at all.
#
# Ordinal, not cardinal: what matters is the ordering, not the magnitudes.
# Nothing reads an absolute value — only comparisons.
costs:

  # cost[true_class][predicted_class]. Diagonal must be 0.
  #
  # The documented asymmetry that must survive whatever you put here:
  #   INFRASTRUCTURE mistaken for TERMINAL -> surrenders a recoverable payment
  #   TERMINAL mistaken for INFRASTRUCTURE -> burns capped attempts, risks a flag
  # These are not equal and the matrix must not treat them as such.
  misclassification:
    INFRASTRUCTURE: {INFRASTRUCTURE: 0, LIQUIDITY: 2, ATTENTION: 2, TERMINAL: 8}
    LIQUIDITY:      {INFRASTRUCTURE: 2, LIQUIDITY: 0, ATTENTION: 2, TERMINAL: 8}
    ATTENTION:      {INFRASTRUCTURE: 3, LIQUIDITY: 3, ATTENTION: 0, TERMINAL: 5}
    TERMINAL:       {INFRASTRUCTURE: 6, LIQUIDITY: 6, ATTENTION: 4, TERMINAL: 0}

  # Cost of one customer-visible contact, by the failure's true class.
  # This is where the mandate-survival argument gets priced: contacting someone
  # whose card is dead spends goodwill against a recovery that cannot happen,
  # and repeated contact is what gets a mandate cancelled from the UPI app.
  # TODO(author): TERMINAL contact should dominate. ATTENTION contact is the
  # one that earns its cost — the customer was reached but never acted.
  contact:
    INFRASTRUCTURE: 1
    LIQUIDITY: 2
    ATTENTION: 1
    TERMINAL: 6

# --- Rules ------------------------------------------------------------------
# Matched most-specific-first. An omitted field is a wildcard, so a rule naming
# only `step` matches any source and reason. Specificity is the count of named
# fields; two rules matching at equal specificity is an error at load time, not
# a coin toss at runtime.
#
# `cause_family` is optional and free-form. Two failures can share a class and
# still need different actions: an expired card is TERMINAL for an *instrument*
# reason and a card-change offer may recover it, while
# `international_transaction_not_allowed` is TERMINAL for a *merchant
# configuration* reason and nothing the customer does will help. Same zero retry
# probability, different remedy — and the allocator needs to tell them apart.
# The families themselves are yours to name.
#
# ILLUSTRATIVE ONLY — rows to exercise the machinery. The real table is yours,
# and these should be replaced wholesale rather than extended.
rules:
  - match: {method: upi, step: payment_authentication}
    class: ATTENTION
    confidence: 0.90
    note: "Customer reached, never entered M-PIN. Retry has ~zero marginal value."

  - match: {method: upi, step: payment_initiation}
    class: INFRASTRUCTURE
    confidence: 0.88
    note: "Broke before reaching the customer."

  - match: {method: upi, step: payment_creation}
    class: INFRASTRUCTURE
    confidence: 0.88

  - match: {method: upi, source: customer_psp, step: payment_debit_response}
    class: LIQUIDITY
    confidence: 0.92
    note: "Customer's bank declined. LIQUIDITY or INFRASTRUCTURE by source."

  - match: {method: card, step: card_enrollment_check}
    class: TERMINAL
    confidence: 0.70
    note: "Card not 3DS-enrolled. TERMINAL-adjacent, hence the lower confidence."

  - match: {method: card, source: issuer_bank, reason: payment_expired_card}
    class: TERMINAL
    confidence: 0.99
    cause_family: instrument
    note: "P(retry succeeds) = 0 by definition. This is the primary claim's basis."

  # From a real capture. Terminal for a merchant-configuration reason: the card
  # is perfectly valid and will never work with this business. A recovery link
  # is pointless, a card change is pointless; only the merchant can fix it.
  - match: {method: card, source: business, reason: international_transaction_not_allowed}
    class: TERMINAL
    confidence: 0.97
    cause_family: merchant_configuration
    note: "Business accepts domestic cards only. Customer cannot act on this."

  # From a real capture, and the canonical low-confidence case. `payment_failed`
  # from `bank` carries no information — Razorpay's own error_description says
  # only 'try another payment method or contact your bank'. This will be common,
  # and the honest response is a LOW band that hands the decision to the cost
  # model rather than a guess dressed up as a classification.
  - match: {method: netbanking, source: bank, step: payment_authorization, reason: payment_failed}
    class: LIQUIDITY
    confidence: 0.30
    cause_family: generic_decline
    note: "Generic decline. No information in the payload; do not pretend otherwise."
