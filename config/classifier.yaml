# =============================================================================
# AUTHORED. The classifier reads this file and contains no mapping of its own.
#
# Provenance differs by row and is worth knowing before defending any of them:
#
#   * The two `insufficient_funds` rows and the six deliberately-low rows are
#     authored, each with its reasoning in the note.
#   * The `international_transaction_not_allowed` and netbanking `payment_failed`
#     rows come from captured test-mode payloads.
#   * The remaining UPI rows are derived from the error-parameters reference and
#     are **not** backed by a capture. Test mode never exposed UPI, which is the
#     project's primary rail — see ASSUMPTIONS.md. They are the rows most likely
#     to be wrong.
#
# The cost values are authored. The ordering is the claim; magnitudes are
# deliberately coarse and ordinal.
# =============================================================================

status: AUTHORED
version: "1.0.0"

# --- Value space ------------------------------------------------------------
# Method-partitioned: the legal `source` values differ per method.
#
# **This is a LOWER BOUND, not an enumeration.** It is assembled from the
# error-parameters reference, and that reference is a subset of what the API
# actually returns. A captured test-mode netbanking failure came back with
# `source: bank`, which the reference lists only for emandate — so `bank` is
# now in the netbanking set, from evidence rather than from the doc.
#
# A source outside its method's set is **surfaced, not rejected**: it is
# recorded on the classification and audited for review, and classification
# proceeds normally. Rejecting on it discarded valid production payloads.
# See CHALLENGES 007.
#
# Still true and worth keeping: there is no `razorpay` source — it is `internal`.

# `razorpay` is here on the evidence of the List of Errors page, which
# contradicts the error-parameters page that says the source is `internal`.
# Both are Razorpay documentation. Accepting both is the lower-bound rule from
# CHALLENGES 007 applied to a conflict between two first-party sources rather
# than to a gap in one.
source_space:
  card: [customer, business, internal, gateway, issuer_bank, razorpay]
  upi: [customer, business, internal, gateway, issuer_bank, customer_psp, network, beneficiary_bank, razorpay]
  # `bank` is here on the evidence of a real capture, not on the documentation.
  netbanking: [customer, business, internal, issuer_bank, bank, razorpay]
  emandate: [customer, bank, business, internal, gateway, issuer_bank, razorpay]
  # Wallet and Cardless EMI are documented in the same reference and were absent
  # here, which mattered more than it looks: a method with no entry passes the
  # documented-source check *vacuously*, so the two captured wallet payloads were
  # reporting `source_in_documented_space: True` without anything having been
  # checked. Absent from the map read exactly like validated.
  #
  # Neither is a mandate rail, so neither can carry a recurring debit. They are
  # here so the check means what it says, not because this system acts on them.
  wallet: [customer, business, internal, issuer, razorpay]
  cardless_emi: [customer, business, internal, network, issuer, razorpay]

# Deliberately empty. An alias silently rewrites an observed value, so each one
# needs a documented justification. Populate only with cause to.
#   Example, if it were ever justified:  {razorpay: internal}
source_aliases: {}

# --- Step space -------------------------------------------------------------
# Also a lower bound, and assembled from three places: the steps named by rules
# in this file, the step table in CLAUDE.md, and the two below that are
# documented but carry no rule yet. UPI exposes roughly fourteen steps and this
# does not list them all.
#
# **This validates rules, not payloads.** A payload carrying a step outside the
# space classifies normally -- the same lower-bound rule as `source_space`. What
# it catches is a rule that names a step this project has never seen: a typo in
# a `match` block produces a row that silently never fires, and a dead row looks
# exactly like a present one from anywhere except the matcher. Load fails
# instead.
#
# `customer_onboarding` and `account_management` are here with no rule attached.
# That is the point of recording them: they are steps that exist, and when a row
# is eventually written for one it will validate rather than be rejected.
step_space:
  card: [payment_initiation, payment_creation, payment_authentication,
         payment_authorization, payment_capture, card_enrollment_check,
         customer_onboarding, account_management]
  # UPI exposes the widest step space of any method, and the request/response
  # pairing is the useful part: `payment_debit_request` broke on the way to the
  # bank, `payment_debit_response` means the bank answered and declined. One is
  # infrastructure, the other is a decision by the customer's bank.
  upi: [payment_initiation, payment_creation, payment_authentication,
        payment_authentication_request, payment_authentication_response,
        payment_authorization, payment_request,
        payment_request_beneficiary_details, payment_response_beneficiary_details,
        payment_debit_request, payment_debit_response,
        payment_credit_request, payment_credit_response,
        payment_status_request, payment_status_response, payment_response,
        refund_request, mandate_creation,
        customer_onboarding, account_management]
  netbanking: [payment_initiation, payment_creation, payment_authentication,
               payment_authorization, customer_onboarding, account_management]
  wallet: [payment_initiation, payment_creation, payment_authentication,
           payment_authorization, payment_eligibility_check,
           customer_onboarding, account_management]
  cardless_emi: [payment_initiation, payment_creation, payment_authentication,
                 payment_authorization, customer_onboarding, account_management]
  emandate: [payment_initiation, payment_creation, payment_authentication,
             payment_authorization, payment_debit_response, mandate_creation,
             customer_onboarding, account_management]

# --- Confidence -------------------------------------------------------------
# Confidence is an output of classification, not a footnote on it. The bands
# are what downstream components branch on:
#   HIGH     -> act on the class, exclusion permitted (C10)
#   MODERATE -> act on the class, but reorder only, never exclude
#   LOW      -> do not trust the class; resolve through the cost matrix
confidence_bands:
  high: 0.85
  moderate: 0.60

# --- Fallback ---------------------------------------------------------------
# There is deliberately **no `fallback.class`**. An unmapped key resolves through
# the cost model below, so a configured fallback cannot drift out of agreement
# with the matrix that is supposed to justify it. Change the costs and the
# fallback follows automatically.
#
# Never silently applied: every use emits `failure.unmapped` to the audit trail
# with the key that missed.
fallback:
  confidence: 0.0

# --- Cost model -------------------------------------------------------------
# Authored. Two priced things, because a decision costs more than
# a wrong label: getting the class wrong, and contacting the customer at all.
#
# Ordinal, not cardinal: what matters is the ordering, not the magnitudes.
# Nothing reads an absolute value — only comparisons.
costs:

  # cost[true_class][predicted_class]. Diagonal is 0.
  #
  # Ordinal. Nothing reads an absolute value — only comparisons. Magnitudes are
  # deliberately coarse; finer numbers would imply precision no source supports.
  #
  # The governing asymmetry: mistaking a recoverable failure for TERMINAL
  # surrenders one payment and the mandate survives. Mistaking TERMINAL for
  # recoverable spends a capped execution that cannot succeed AND buys a failure
  # notification that moves the customer toward cancelling. The second damages
  # the annuity; the first does not.
  misclassification:
    INFRASTRUCTURE: {INFRASTRUCTURE: 0, LIQUIDITY: 1, ATTENTION: 1, TERMINAL: 3}
    LIQUIDITY:      {INFRASTRUCTURE: 1, LIQUIDITY: 0, ATTENTION: 1, TERMINAL: 3}
    ATTENTION:      {INFRASTRUCTURE: 3, LIQUIDITY: 3, ATTENTION: 0, TERMINAL: 3}
    TERMINAL:       {INFRASTRUCTURE: 10, LIQUIDITY: 10, ATTENTION: 4, TERMINAL: 0}

  # Cost of one customer-visible contact, by the failure's TRUE class. Priced
  # separately because a contact is spent even when the class is right, and
  # repeated contact is the mechanism that gets a mandate cancelled.
  #
  # ATTENTION is cheapest because the contact IS the intervention — the customer
  # was reached and did not act, so reaching them differently is the only thing
  # that can work. TERMINAL dominates because a generic contact about a dead
  # instrument spends goodwill against a recovery that cannot happen on that
  # instrument. The card-change offer is a separate, explicitly selected action.
  contact:
    INFRASTRUCTURE: 2
    LIQUIDITY: 2
    ATTENTION: 1
    TERMINAL: 6

# --- Free-text enrichment (C13) ----------------------------------------------
# AUTHORED. The marker -> cause_family map for `recovery/enrich.py`.
#
# The model returns MARKERS -- observations about what a customer-facing string
# says. It never returns a class, a family, or a number. This table is where a
# marker becomes a family, and it is authored for the same reason the taxonomy
# is: a model that picked the family would be deciding, and the whole boundary
# is that it parses.
#
# A family only ever changes what a CONTACT SAYS. It cannot change the class,
# the band, the confidence, or whether an execution is spent -- `refine` copies
# exactly one field and a test asserts every other field is untouched.
#
# `bank_referral` and `no_information` are deliberately absent. "Contact your
# bank" is the single most common phrase in these strings and it identifies
# nothing -- mapping it would manufacture a distinction the text does not make.
enrichment:
  families:
    instrument_unusable: instrument
    insufficient_balance: funding
    customer_abandoned: cancel_reason_unknown
    technical_fault: technical_error_opaque
    merchant_configuration: merchant_configuration

# --- Rules ------------------------------------------------------------------
# Matched most-specific-first. An omitted field is a wildcard, so a rule naming
# only `step` matches any source and reason. Specificity is the count of named
# fields; two rules matching at equal specificity is an error at load time, not
# a coin toss at runtime.
#
# `cause_family` is optional and free-form. Two failures can share a class and
# still need different actions: an expired card is TERMINAL for an *instrument*
# reason and a card-change offer may recover it, while
# `international_transaction_not_allowed` is TERMINAL for a *merchant
# configuration* reason and nothing the customer does will help. Same zero retry
# probability, different remedy — and the allocator needs to tell them apart.
# The families themselves are yours to name.
# The eight rows below the illustrative UPI block are authored or captured. The
# first five UPI/card rows remain documentation-derived with no capture behind
# them — see the header. Provenance is per row, not per file.
rules:
  - match: {method: upi, step: payment_authentication}
    class: ATTENTION
    confidence: 0.90
    note: "Customer reached, never entered M-PIN. Retry has ~zero marginal value."

  - match: {method: upi, step: payment_initiation}
    class: INFRASTRUCTURE
    confidence: 0.88
    note: "Broke before reaching the customer."

  - match: {method: upi, step: payment_creation}
    class: INFRASTRUCTURE
    confidence: 0.88

  - match: {method: upi, source: customer_psp, step: payment_debit_response}
    class: LIQUIDITY
    confidence: 0.92
    note: "Customer's bank declined. LIQUIDITY or INFRASTRUCTURE by source."

  - match: {method: card, step: card_enrollment_check}
    class: TERMINAL
    confidence: 0.70
    note: "Card not 3DS-enrolled. TERMINAL-adjacent, hence the lower confidence."

  - match: {method: card, source: issuer_bank, reason: payment_expired_card}
    class: TERMINAL
    confidence: 0.99
    cause_family: instrument
    note: "P(retry succeeds) = 0 by definition. This is the primary claim's basis."

  # From a real capture. Terminal for a merchant-configuration reason: the card
  # is perfectly valid and will never work with this business. A recovery link
  # is pointless, a card change is pointless; only the merchant can fix it.
  - match: {method: card, source: business, reason: international_transaction_not_allowed}
    class: TERMINAL
    confidence: 0.97
    cause_family: merchant_configuration
    note: "Business accepts domestic cards only. Customer cannot act on this."

  # From a real capture, and the canonical low-confidence case. `payment_failed`
  # from `bank` carries no information — Razorpay's own error_description says
  # only 'try another payment method or contact your bank'. This will be common,
  # and the honest response is a LOW band that hands the decision to the cost
  # model rather than a guess dressed up as a classification.
  - match: {method: netbanking, source: bank, step: payment_authorization, reason: payment_failed}
    class: LIQUIDITY
    confidence: 0.30
    cause_family: generic_decline
    deliberately_low_confidence: true
    note: "Generic decline. No information in the payload; do not pretend otherwise."

# --- Deliberately low-confidence rows ---------------------------------------
# "No row" and "a row that says this key is genuinely ambiguous" are different
# states, and only the second one is a decision. These six keys are common and
# structurally ambiguous: the payload names a proximate cause that is consistent
# with more than one underlying class, and no amount of reading the payload
# resolves it.
#
# They classify to their most plausible class at a confidence below the moderate
# threshold, so they land in the allocator's LOW row **by design**. Behaviourally
# that is the same as being unmapped -- one recovery link, no execution spent --
# but the record differs: `mapped=True`, a rule index, the intended class visible
# in `cost_resolved_from`, and this flag. An auditor can tell "we considered this
# and concluded we cannot tell" from "we never looked".
#
# Each note names the ambiguity in domain terms. The simulator's mixed ground
# truth corroborates these; it is not the reason for them. Writing rows from the
# generator's own percentages would make any measured accuracy circular.

  - match: {method: upi, source: beneficiary_bank, step: payment_debit_response, reason: mandate_revoked}
    class: TERMINAL
    confidence: 0.45
    cause_family: mandate_state_unclear
    deliberately_low_confidence: true
    note: >-
      A revocation reported by the beneficiary bank may be a real customer
      revocation, or the bank surfacing its own mandate-state error under the
      same reason code. TERMINAL is the safer reading, but not a confident one.

  - match: {method: emandate, source: bank, step: payment_debit_response, reason: mandate_revoked}
    class: TERMINAL
    confidence: 0.45
    cause_family: mandate_state_unclear
    deliberately_low_confidence: true
    note: >-
      Same ambiguity as the UPI case. Emandate registration state is asynchronous
      and lags, so a revocation report can reflect a stale mandate record.

  - match: {method: card, source: customer, step: payment_authentication, reason: payment_ux_canceled}
    class: ATTENTION
    confidence: 0.45
    cause_family: cancel_reason_unknown
    deliberately_low_confidence: true
    note: >-
      "Customer cancelled" says what they did, not why. Abandoning at
      authentication because they were interrupted is ATTENTION; abandoning
      because they saw their balance is LIQUIDITY. The payload cannot separate
      them.

  - match: {method: emandate, source: customer, step: payment_authentication, reason: payment_ux_canceled}
    class: ATTENTION
    confidence: 0.45
    cause_family: cancel_reason_unknown
    deliberately_low_confidence: true
    note: "Same ambiguity as the card case."

  - match: {method: card, source: gateway, step: payment_initiation, reason: gateway_technical_error}
    class: INFRASTRUCTURE
    confidence: 0.50
    cause_family: technical_error_opaque
    deliberately_low_confidence: true
    note: >-
      A gateway technical error at initiation is usually infrastructure, but it
      is also the bucket a gateway uses when it cannot classify a downstream
      decline. Confident enough to prefer INFRASTRUCTURE, not confident enough
      to spend a capped execution on it.

  - match: {method: emandate, source: gateway, step: payment_initiation, reason: gateway_technical_error}
    class: INFRASTRUCTURE
    confidence: 0.50
    cause_family: technical_error_opaque
    deliberately_low_confidence: true
    note: "Same ambiguity as the card case."

# --- Confident rows ---------------------------------------------------------
# `insufficient_funds` names the cause directly and has no competing
# interpretation, unlike `payment_failed` or `gateway_technical_error`. The bank
# is stating that the account lacked balance. That specificity is why these band
# HIGH while the six ambiguous keys above do not — the difference is not how
# common the key is, it is whether the payload admits a second reading.
#
# A confident LIQUIDITY band is what earns a funding-window retry instead of a
# recovery link, so these two rows carry more of the allocator's behaviour than
# any others.

  - match: {method: card, source: issuer_bank, step: payment_authorization, reason: insufficient_funds}
    class: LIQUIDITY
    confidence: 0.93
    cause_family: funding
    note: >-
      The issuer is stating the account lacked balance. No competing reading:
      the instrument is valid, the mandate is valid, the balance is not.

  - match: {method: emandate, source: bank, step: payment_debit_response, reason: insufficient_funds}
    class: LIQUIDITY
    confidence: 0.93
    cause_family: funding
    note: >-
      Same reasoning as the card row. Note `source: bank` — the undocumented
      value found in the captures and added to the value space on that evidence
      rather than on the reference. See CHALLENGES 007.

# --- Mandate-registration rows ----------------------------------------------
# AUTHORED. **Unreachable from the current ingest**, and marked so in the file
# rather than left for a reader to work out.
#
# `payment.failed` is not triggered on an authorisation failure, and mandate
# registration fails at authorisation. So no event this system consumes carries
# these keys, and no batch figure moves when they are added. They are here for
# taxonomy completeness: the classifier's job is to have an answer for a key
# that exists, not only for a key that currently arrives.
#
# Reaching them needs `subscription.pending` ingestion, which is deliberately
# not built -- registration drop-off is Intelligent Retry Engine's territory,
# and duplicating a shipped product is the mistake CHALLENGES 001 records. It is
# listed in NOT_BUILT.md as a leak identified and not addressed.
#
# They match on `reason` alone. Registration failures are not method-specific in
# any way the reason codes distinguish, and a method constraint would be scope
# invented rather than authored.

  - match: {reason: mandate_creation_declined}
    class: TERMINAL
    confidence: 0.85
    cause_family: mandate_registration
    unreachable: true
    note: >-
      The bank refused registration. There is no mandate to retry against --
      not a failed debit but the absence of the thing a debit would execute
      on. Distinct from `mandate_revoked`, where a mandate existed and stopped.

  - match: {reason: mandate_creation_expired}
    class: ATTENTION
    confidence: 0.80
    cause_family: mandate_registration
    unreachable: true
    note: >-
      The customer did not complete registration in time. ATTENTION rather than
      TERMINAL because the customer is reachable and willing -- they started.
      What it needs is a registration link, not a retry; there is nothing to
      retry.

  - match: {reason: mandate_creation_failed}
    class: INFRASTRUCTURE
    confidence: 0.50
    cause_family: mandate_registration
    deliberately_low_confidence: true
    unreachable: true
    note: >-
      Generic. It is the bucket registration uses when it cannot say which of
      the three rows above happened, so it is consistent with all of them.
      INFRASTRUCTURE is the most plausible reading and 0.50 is the honest
      confidence in it.

  - match: {reason: mandate_creation_timeout}
    class: INFRASTRUCTURE
    confidence: 0.75
    cause_family: mandate_registration
    unreachable: true
    note: "Transient failure at registration. The one row here that a repeat attempt fixes."

# --- Funds committed elsewhere ----------------------------------------------
# AUTHORED. Reachable, but the simulator does not emit either key, so these
# change no reported figure either.
#
# `funds_committed` is a separate family from `funding` on purpose. Both are
# LIQUIDITY and both recover with time, but they are different facts: `funding`
# is an empty account, `funds_committed` is a full one whose balance is held by
# another mandate. The second has a release date. The first does not.

  - match: {reason: funds_blocked_by_mandate}
    class: LIQUIDITY
    confidence: 0.88
    cause_family: funds_committed
    note: >-
      The funds exist and are held by another mandate. Time-dependent rather
      than absent, which is the strongest case in the taxonomy for waiting: the
      block has an end, and retrying before it does spends an execution against
      a lien that is still in force.

  - match: {reason: insufficient_funds_mandate_block}
    class: LIQUIDITY
    confidence: 0.88
    cause_family: funds_committed
    note: >-
      Same reasoning. The reason code reads like `insufficient_funds` and is
      not the same fact -- the balance is present and committed, not missing.
      Classifying it as plain funding would lose the release date.

# --- PSP capability ---------------------------------------------------------
# AUTHORED. TERMINAL for a reason no other TERMINAL row shares: the failure is
# a property of the *app*, not of the instrument, the mandate or the account.

  - match: {reason: upi_autopay_not_supported_on_psp}
    class: TERMINAL
    confidence: 0.95
    cause_family: psp_capability
    note: >-
      Autopay never works on this PSP, so every remaining execution against it
      fails identically -- P(retry succeeds) = 0, the same basis as the expired
      card. But a different app would work, which no other TERMINAL row can
      say. The remedy is rail migration or a different handle, not a card
      change and not a link.

# --- Acknowledgement ---------------------------------------------------------

  - match: {reason: reqauth_mandate_not_acknowledged}
    class: ATTENTION
    confidence: 0.70
    cause_family: acknowledgement
    note: >-
      The customer was asked to acknowledge and did not. Squarely ATTENTION:
      they were reached, the ask landed, and nothing came back. Retrying the
      same ask through the same channel is the definition of no marginal value.
      MODERATE rather than HIGH because silence does not say whether they saw
      it and declined or never saw it.
